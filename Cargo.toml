[package]
name = "takecaredev"
version = "0.3.1"
edition = "2024"
description = "Pixel-face reminders for eye exercises and walking breaks"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
x11rb = { version = "0.14", features = ["randr", "screensaver"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tao = "0.37.3"
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
winit = "0.30"

[profile.release]
lto = true
strip = true
