name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, bin: takecaredev }
          - { os: windows-latest, name: windows-x86_64, bin: takecaredev.exe }
          - { os: macos-latest, name: macos-arm64, bin: takecaredev }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} dist/
          cp README.md dist/
      # macOS: a zipped TakeCareDev.app (ditto keeps the bundle's permissions and signature intact).
      - name: Package app
        if: runner.os == 'macOS'
        run: |
          scripts/macos-app.sh build
          mkdir dist
          ditto -c -k --keepParent build/TakeCareDev.app dist/takecaredev-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: takecaredev-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip each platform
        run: |
          cd artifacts
          for d in */; do
            if [ -e "$d${d%/}.zip" ]; then mv "$d${d%/}.zip" .; continue; fi  # already zipped (macOS app)
            (cd "$d" && chmod +x takecaredev* && zip -r "../${d%/}.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
